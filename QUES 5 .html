<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Bill</title>
    <style>
       body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        table {
            width: 60%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #281f9b;
            padding: 10px; 
            text-align: center;
        }
        td:first-child, th:first-child {
            text-align: left;
        }
    </style>
</head>
<body>

    <h2>Shopping Bill</h2>

    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price (₹)</th>
                <th>Amount (₹)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Notebook</td>
                <td>2</td>
                <td>50</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Pen</td>
                <td>5</td>
                <td>10</td>
                <td>50</td>
            </tr>
            <tr>
                <td>Book</td>
                <td>1</td>
                <td>200</td>
                <td>200</td>
            </tr>
            <tr>
                <td>Bag</td>
                <td>1</td>
                <td>500</td>
                <td>500</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3" style="text-align: right;"><b>Total</b></td>
                <td><b>850</b></td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
